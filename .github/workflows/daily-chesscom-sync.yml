name: Chess.com league sync

on:
  workflow_dispatch:
    inputs:
      full_backfill:
        description: Recheck all archive months instead of just the current month
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.full_backfill && 'chesscom-full-backfill' || 'chesscom-recent-sync' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import newly published Chess.com games
        env:
          FULL_BACKFILL: ${{ inputs.full_backfill }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/daily-chesscom-sync.mjs
