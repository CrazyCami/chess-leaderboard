name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://supabase.test
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test phone and desktop viewports
        run: npx playwright test
